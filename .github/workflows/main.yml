name: lacoste-project

on:
  push:
    branches: ["main"]

jobs:
  cypress:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cypress-io/github-action@v6
        with:
          config: video=true,screenshotOnRunFailure=true
          path: |
            cypress/screenshots/
            cypress/videos/
          if-no-files-found: ignore